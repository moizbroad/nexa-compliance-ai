[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naxa-compliance-api"
version = "0.1.0"
description = "Naxa deterministic invoice compliance API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

